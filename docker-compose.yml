services:
  postgres:
    image: postgres:16/postgis:16-3.4
    container_name: brewscout-postgres
    environment:
      POSTGRES_DB: brewscout
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - brewscout_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d brewscout"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  brewscout_postgres_data:

